[alias]
# Build tool: `cargo xtask help` (see xtask/src/main.rs).
xtask = "run --quiet --package xtask --"

# Where the loader finds the kernel ELF to embed (DECISIONS.md, 004).
# `cargo xtask build` sets this explicitly, also for release builds.
[env]
HEMATITE_KERNEL_ELF = { value = "target/x86_64-unknown-none/debug/kernel", relative = true }

[workspace]
resolver = "3"
members = ["abi", "acpi", "boot_info", "capability", "elf", "frame_table", "heap", "kernel", "loader", "paging", "programs/ask", "programs/count", "programs/directory", "programs/display", "programs/giver", "programs/hello", "programs/init", "programs/intruder", "programs/keyboard", "programs/log", "programs/owner", "programs/paint", "programs/shell", "programs/shout", "programs/terminal", "programs/vandal", "scheduling", "userlib", "x86", "xtask"]
# Plain `cargo test` / `cargo clippy` only touch the crates that build for
# the host. Kernel and loader always need an explicit `--target`
# (`cargo xtask` handles that).
default-members = ["abi", "acpi", "boot_info", "capability", "elf", "frame_table", "heap", "paging", "scheduling", "x86", "xtask"]

# There is no OS underneath us to unwind the stack on panic, so just abort.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# The programs that push pixels are optimized even in debug builds: an
# unoptimized pixel loop made every key press take ~110 ms to show
# (DECISIONS.md, 026). Everything else stays easy to debug.
[profile.dev.package.userlib]
opt-level = 2

[profile.dev.package.display]
opt-level = 2

[profile.dev.package.terminal]
opt-level = 2

[profile.dev.package.paint]
opt-level = 2

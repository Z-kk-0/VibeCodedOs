[workspace]
resolver = "3"
members = ["abi", "acpi", "boot_info", "capability", "elf", "frame_table", "heap", "kernel", "loader", "paging", "programs/directory", "programs/display", "programs/giver", "programs/hello", "programs/init", "programs/intruder", "programs/keyboard", "programs/log", "programs/owner", "programs/paint", "programs/shout", "programs/terminal", "programs/vandal", "scheduling", "userlib", "x86", "xtask"]
# Plain `cargo test` / `cargo clippy` only touch the crates that build for
# the host. Kernel and loader always need an explicit `--target`
# (`cargo xtask` handles that).
default-members = ["abi", "acpi", "boot_info", "capability", "elf", "frame_table", "heap", "paging", "scheduling", "x86", "xtask"]

# There is no OS underneath us to unwind the stack on panic, so just abort.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
